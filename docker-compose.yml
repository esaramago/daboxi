services:
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.pocketbase
    container_name: daboxi-pocketbase
    restart: unless-stopped
    volumes:
      - pocketbase_data:/pb_data
    ports:
      - "8090:8090"
    networks:
      - daboxi-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - POCKETBASE_URL=${POCKETBASE_URL:-http://pocketbase:8090}
        - NEXT_PUBLIC_POCKETBASE_URL=${NEXT_PUBLIC_POCKETBASE_URL:-http://localhost:8090}
        - NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
        - SOURCE_COMMIT=${SOURCE_COMMIT:-}
    container_name: daboxi-app
    environment:
      - POCKETBASE_URL=${POCKETBASE_URL:-http://pocketbase:8090}
      - NEXT_PUBLIC_POCKETBASE_URL=${NEXT_PUBLIC_POCKETBASE_URL:-http://localhost:8090}
      - NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - pocketbase
    deploy:
      resources:
        limits:
          cpus: '1.0'      # Limita a 1 CPU core
          memory: 2G       # Limita a 2GB de RAM
        reservations:
          cpus: '0.5'      # Reserva mínima de 0.5 CPU
          memory: 512M     # Reserva mínima de 512MB
    networks:
      - daboxi-network

volumes:
  pocketbase_data:

networks:
  daboxi-network:
    driver: bridge
